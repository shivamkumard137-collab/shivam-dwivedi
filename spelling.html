<!DOCTYPE html>
<html>
<head>
  <title>Spelling Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f8e9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px 10px;
      box-sizing: border-box;
    }

    .box {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 420px;
      max-width: 95%;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 42%;
      padding: 10px;
      margin: 10px 3px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #388e3c;
    }

    #result {
      margin-top: 20px;
      text-align: left;
      max-height: 500px;
      overflow-y: auto;
    }

    .row {
      padding: 8px 10px;
      border-bottom: 1px solid #ddd;
      font-size: 17px;
    }

    .number {
      display: inline-block;
      width: 55px;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Spelling Generator</h2>

    <div>
      <input type="number" id="fromNum" placeholder="From" min="0" max="999">
      <input type="number" id="toNum" placeholder="To" min="0" max="999">
    </div>

    <button onclick="showSpellings()">Generate Spellings</button>

    <div id="result"></div>
  </div>

  <script>
    // Function to convert a number into English spelling
    function numberToWords(num) {
      const ones = [
        "", "One", "Two", "Three", "Four",
        "Five", "Six", "Seven", "Eight", "Nine"
      ];

      const teens = [
        "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen",
        "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"
      ];

      const tens = [
        "", "", "Twenty", "Thirty", "Forty",
        "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"
      ];

      if (num === 0) {
        return "Zero";
      }

      let words = "";

      if (num >= 100) {
        words += ones[Math.floor(num / 100)] + " Hundred";
        num %= 100;

        if (num > 0) {
          words += " ";
        }
      }

      if (num >= 20) {
        words += tens[Math.floor(num / 10)];
        num %= 10;

        if (num > 0) {
          words += " " + ones[num];
        }
      } else if (num >= 10) {
        words += teens[num - 10];
      } else if (num > 0) {
        words += ones[num];
      }

      return words;
    }

    // Function to generate spelling from one number to another
    function showSpellings() {
      const from = parseInt(document.getElementById("fromNum").value);
      const to = parseInt(document.getElementById("toNum").value);
      const resultArea = document.getElementById("result");

      resultArea.innerHTML = "";

      if (isNaN(from) || isNaN(to)) {
        resultArea.innerHTML =
          '<div class="error">Please enter both numbers!</div>';
        return;
      }

      if (from < 0 || to < 0 || from > 999 || to > 999) {
        resultArea.innerHTML =
          '<div class="error">Please enter numbers between 0 and 999!</div>';
        return;
      }

      if (from > to) {
        resultArea.innerHTML =
          '<div class="error">"From" number must be smaller than "To" number!</div>';
        return;
      }

      if (to - from > 999) {
        resultArea.innerHTML =
          '<div class="error">Please keep the range within 1000 numbers.</div>';
        return;
      }

      for (let i = from; i <= to; i++) {
        const row = document.createElement("div");
        row.className = "row";

        row.innerHTML =
          '<span class="number">' + i + '</span> - ' +
          numberToWords(i);

        resultArea.appendChild(row);
      }
    }
  </script>
</body>
</html>
